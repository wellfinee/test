<!-- 
Flexbox (display: flex)

flexbox - достаточно новая технология, для расположения элементов в контейнере
задается для контейнера, управляет внетренними элементами

flex-direction: - направление главной оси контейнера

главная ось - то  куда выстроены элементы контейнера 
row - горизонтально
column - вертикально

поперечная ось - ось которая идет поперек главной оси


flex-wrap: - можно ли элементам переходить на новую строку или колонку
wrap - можно
nowrap - нельзя



justify-content - управляет главной осью, всегда
если главная ось направлена горизонтально, justify-content - управляет горизонталью

  start - слева или сверху
  center - посередке
  end - справа или снизу
  space-between - простраство между элементами будет
  space-around - пространство вокруг элементов
  space-evenly - пространство равномерное, вокруг




align-itemn - управляет поперечной осью всегда
если flex-direction - row, то align-items управляет колонкой
если наоборот, то наоборот

  start - слева или сверху
  center - посередке
  end - справа или снизу



gap - растояние между элементами
 -->
